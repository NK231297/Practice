<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <title>
        Tip-Calculator
    </title>
    
    <body>

        <div class="container">
            <h3>Tip Calculator</h3>

            <p>Enter the bill amount and the tip percentage to calculate the total.</p>

            <label for="bill-amount">Bill amount:</label>
            <input class="js-bill-amount" type="number" name="bill-amount" id="bill-amount">

            <label for="tip-percentage">Tip percentage:</label>
            <input class="js-tip-percent" type="number" name="tip-percentage" id="tip-percentage">

            <button class="js-calculate-button">Calculate</button>

            <p>
                Total: <span class="js-total"></span>
            </p>
        </div>




        <script type="module" src="script.js"></script>
    </body>
</html>
