<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="div1">
        <h1>Rock Paper Scissor</h1>
        <div class="div1-I">
            <button id="rock">&#9994</button>
            <button id="paper">&#9995</button>
            <button id="scissor">&#9996</button>
        </div>
    </div>
    <div class="div2">
        <div class="div2-I">
            <p id="desicion">---Decision---</p>
        </div>

        <div class="div2-II">
            <p id="move">You: <span id="you">-</span> | <span id="computer">-</span> :Com</p>
        </div>

        <div class="div2-III">
            <p id="score">Win: <span id="winNum">-</span> | Lose: <span id="loseNum">-</span> | Draw: <span id="drawNum">-</span></p>
        </div>
    </div>
    
    <button id="reset">Reset</button>
    <button id="autoPlay">Auto Play</button>
    <script src="script.js"></script>
</body>
</html>
