<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="container">
        <div class="result">
            <p id="resultPrint"></p>
        </div>
        <!-- NumPad -->
        <div class="essentials">
            <button id="getLastResult"><i class="fas fa-history"></i></button>
            <button id="clear">C</button>
            <button id="clearHis">CA</button>
        </div>
         <div class="numPad">
            <div class="numbers">


                <div class="column1">
                    <button id="num1">1</button>
                    <button id="num4">4</button>
                    <button id="num7">7</button>
                    <button id="num0">0</button>
                </div>

                <div class="column2">
                    <button id="num2">2</button>
                    <button id="num5">5</button>
                    <button id="num8">8</button>
                    <button id="numDot"><i class="fas fa-circle" style="color:white; font-size: 6px;"></i></button>
                </div>

                <div class="column3">
                    <button id="num3">3</button>
                    <button id="num6">6</button>
                    <button id="num9">9</button>
                    <button id="equal">=</button>
                </div>

               

            </div>

            <div class="equationColumn">
                <button id="plus"><i class="fas fa-plus" style="color:white;"></i></button>
                <button id="minus"><i class="fas fa-minus" style="color:white;"></i></button>
                <button id="multiply"><i class="fas fa-multiply" style="color:white;"></i></button>
                <button id="divide"><i class="fas fa-divide" style="color:white;"></i></button>
            </div>
        </div>
        
    
        <!-- Essentials -->
         
    </div>
    <script src="script.js"></script>
</body>
</html>
